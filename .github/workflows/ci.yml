name: CI

on:
  push:
    branches: [main, nova/local-construction-snapshot, nova/runtime-architecture-v1]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify
        run: npm run verify

      - name: Export canonical art references
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[art-ref-export]')
        uses: actions/upload-artifact@v4
        with:
          name: sysselcraft-canonical-character-sheets
          path: public/assets/village/character-sheets/*.png
          if-no-files-found: error
          retention-days: 1
