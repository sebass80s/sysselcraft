name: Nova direct master image

on:
  push:
    branches:
      - nova/vercel-free-batch
    paths:
      - .github/workflows/nova-direct-master-image.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: nova/vercel-free-batch
      - run: python scripts/nova_switch_master_to_direct_image.py
      - run: |
          git config user.name "Nova Sysselcraft"
          git config user.email "actions@users.noreply.github.com"
          git add src/game/createVillageGame.ts
          git diff --cached --quiet && exit 0
          git commit -m "Load painted master scene directly in Phaser [skip ci]"
          git push origin HEAD:nova/vercel-free-batch
