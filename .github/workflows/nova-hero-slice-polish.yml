name: Nova hero slice polish

on:
  push:
    branches:
      - nova/vercel-free-batch

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: nova/vercel-free-batch
      - name: Apply hero slice polish
        run: python3 scripts/nova_hero_slice_polish.py
      - name: Commit patch
        run: |
          git config user.name "Nova"
          git config user.email "actions@users.noreply.github.com"
          git add src/game/createVillageGame.ts docs/ART_DIRECTION.md
          git commit -m "Polish hero slice marker and correct POC status [skip ci]"
          git push origin HEAD:nova/vercel-free-batch
