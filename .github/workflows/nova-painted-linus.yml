name: Nova painted Linus integration

on:
  push:
    branches:
      - nova/vercel-free-batch
    paths:
      - .github/workflows/nova-painted-linus.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: nova/vercel-free-batch
      - run: python scripts/nova_switch_linus_painted.py
      - run: |
          git config user.name "Nova Sysselcraft"
          git config user.email "actions@users.noreply.github.com"
          git add src/game/createVillageGame.ts
          git diff --cached --quiet && exit 0
          git commit -m "Use painted Linus in master scene experiment [skip ci]"
          git push origin HEAD:nova/vercel-free-batch

# trigger: painted-linus-pass-1
