name: Nova painted puppy integration
on:
  push:
    branches: [nova/vercel-free-batch]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: nova/vercel-free-batch
      - run: python3 scripts/nova_painted_puppy.py
      - run: |
          git config user.name "Nova"
          git config user.email "actions@users.noreply.github.com"
          git add src/game/createVillageGame.ts
          git commit -m "Use painted puppy in hero slice [skip ci]"
          git push origin HEAD:nova/vercel-free-batch
