<svg xmlns="http://www.w3.org/2000/svg" width="360" height="280" viewBox="0 0 360 280">
<defs>
 <linearGradient id="front" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#cf6757"/><stop offset="1" stop-color="#a64742"/></linearGradient>
 <linearGradient id="side" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ad4e45"/><stop offset="1" stop-color="#7e3938"/></linearGradient>
 <linearGradient id="roofFront" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#cf7653"/><stop offset="1" stop-color="#9c483b"/></linearGradient>
 <linearGradient id="roofSide" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#a54d3e"/><stop offset="1" stop-color="#71352f"/></linearGradient>
 <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#d4ebe1"/><stop offset="1" stop-color="#78aeb0"/></linearGradient>
 <linearGradient id="door" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#668f76"/><stop offset="1" stop-color="#3e6657"/></linearGradient>
 <filter id="blur"><feGaussianBlur stdDeviation="4"/></filter>
</defs>
<!-- ground contact: base is around 250 -->
<ellipse cx="180" cy="252" rx="145" ry="18" fill="#294535" opacity=".22" filter="url(#blur)"/>
<!-- foundation with visible thickness -->
<path d="M53 206 181 236 306 201 306 218 181 258 53 224z" fill="#765b4a" opacity=".72"/>
<path d="M53 206 181 236 181 250 53 220z" fill="#9a7860"/>
<path d="M181 236 306 201 306 216 181 250z" fill="#655044"/>
<!-- walls: two coherent faces sharing vertical ridge -->
<path d="M53 112 181 142 181 236 53 206z" fill="url(#front)"/>
<path d="M181 142 306 107 306 201 181 236z" fill="url(#side)"/>
<!-- gable front -->
<path d="M53 112 118 58 181 142z" fill="#c75e50"/>
<!-- roof planes -->
<path d="M35 112 116 40 199 132 181 146 116 70 53 126z" fill="url(#roofFront)"/>
<path d="M116 40 307 88 326 108 199 146 181 142z" fill="url(#roofSide)"/>
<path d="M116 40 307 88" stroke="#efaa76" stroke-width="5" stroke-linecap="round" opacity=".65"/>
<path d="M35 112 116 40 199 132" fill="none" stroke="#e9996d" stroke-width="5" stroke-linejoin="round" opacity=".58"/>
<!-- roof material -->
<g fill="none" stroke="#6f342f" stroke-width="2.4" opacity=".28">
 <path d="M56 105 116 52 183 127"/><path d="M72 111 117 69 170 129"/>
 <path d="M146 55 300 94"/><path d="M135 69 310 102"/><path d="M151 84 286 112"/>
</g>
<!-- chimney -->
<path d="M245 52 269 58 269 102 245 96z" fill="#73675b"/><path d="M269 58 280 54 280 96 269 102z" fill="#554d48"/><path d="M242 50 268 56 282 52 256 46z" fill="#504a45"/>
<g stroke="#9b8d7d" stroke-width="2" opacity=".55"><path d="M249 67 268 72"/><path d="M249 81 268 86"/></g>
<!-- front window -->
<path d="M70 137 111 147 111 190 70 180z" fill="url(#glass)" stroke="#f2e6c8" stroke-width="5"/>
<path d="M90 142v43M70 158l41 10" stroke="#f8edd1" stroke-width="3"/>
<!-- side window -->
<path d="M232 137 276 125 276 169 232 181z" fill="url(#glass)" stroke="#e8d9bb" stroke-width="5"/>
<path d="M254 131v44M232 158l44-12" stroke="#f7ebd0" stroke-width="3"/>
<!-- door on front face with perspective -->
<path d="M130 154 165 162 165 232 130 224z" fill="url(#door)" stroke="#e9d8b8" stroke-width="4"/>
<path d="M137 160 158 165 158 223 137 218z" fill="#79a18a" opacity=".25"/>
<circle cx="154" cy="194" r="3.4" fill="#efc963"/>
<!-- porch projects into ground plane -->
<path d="M116 226 166 238 198 229 149 217z" fill="#a67850"/>
<path d="M116 226 166 238 166 246 116 234z" fill="#77563f"/>
<path d="M166 238 198 229 198 237 166 246z" fill="#60483a"/>
<path d="M111 238 166 251 207 239" fill="none" stroke="#b88a5d" stroke-width="8" stroke-linecap="round"/>
<!-- timber details follow faces -->
<g fill="none" stroke="#f0d6ae" stroke-width="3" opacity=".52"><path d="M58 123 176 151"/><path d="M58 199 176 227"/><path d="M187 151 300 119"/><path d="M187 225 300 193"/></g>
<!-- planted grounding around base -->
<g fill="#52794d"><ellipse cx="55" cy="221" rx="24" ry="13"/><ellipse cx="79" cy="229" rx="25" ry="12"/><ellipse cx="287" cy="211" rx="25" ry="13"/><ellipse cx="311" cy="207" rx="18" ry="10"/></g>
<g fill="#88a865"><ellipse cx="53" cy="214" rx="14" ry="8"/><ellipse cx="78" cy="220" rx="15" ry="8"/><ellipse cx="290" cy="204" rx="14" ry="8"/></g>
<g fill="#f0d46c"><circle cx="47" cy="211" r="2.7"/><circle cx="74" cy="216" r="2.5"/><circle cx="292" cy="200" r="2.6"/></g>
</svg>