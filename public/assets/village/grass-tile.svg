<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="640" viewBox="0 0 1920 640" preserveAspectRatio="none">
  <defs>
    <linearGradient id="meadow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#78996a"/>
      <stop offset="0.42" stop-color="#86a66f"/>
      <stop offset="0.72" stop-color="#73935f"/>
      <stop offset="1" stop-color="#69875a"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c8aa78"/>
      <stop offset="0.5" stop-color="#b89464"/>
      <stop offset="1" stop-color="#a98259"/>
    </linearGradient>
    <linearGradient id="path" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c9ad7f"/>
      <stop offset="1" stop-color="#ad8b63"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.012 0.045" numOctaves="3" seed="17" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0" result="mono"/>
      <feComponentTransfer in="mono" result="softNoise">
        <feFuncA type="table" tableValues="0 0.11"/>
      </feComponentTransfer>
      <feBlend in="SourceGraphic" in2="softNoise" mode="soft-light"/>
    </filter>
    <filter id="groundShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>

  <!-- One continuous ground painting. Gameplay/collision remains independent in Phaser. -->
  <rect width="1920" height="640" fill="url(#meadow)"/>

  <!-- broad tonal masses, intentionally irregular so the hidden nav grid never reads visually -->
  <path d="M0 78 C190 22 388 64 520 40 C705 8 872 74 1038 48 C1240 17 1422 84 1608 49 C1734 25 1844 37 1920 22 L1920 0 L0 0 Z" fill="#668457" opacity="0.26"/>
  <path d="M0 506 C192 465 326 548 515 514 C706 479 832 557 1028 522 C1197 491 1352 555 1524 518 C1687 483 1817 517 1920 487 L1920 640 L0 640 Z" fill="#5f7d52" opacity="0.31"/>
  <path d="M90 176 C245 123 380 142 530 177 C685 212 817 175 945 139 C1110 94 1260 111 1405 154 C1568 202 1720 177 1882 126" fill="none" stroke="#a5bb83" stroke-width="74" opacity="0.12" filter="url(#soft)"/>

  <!-- main old village road, painted as part of the ground rather than laid down as cards -->
  <path d="M-90 515 C188 492 366 452 563 393 C770 331 935 287 1127 266 C1370 239 1632 258 2010 179" fill="none" stroke="#7f684c" stroke-width="154" opacity="0.19" filter="url(#groundShadow)"/>
  <path d="M-90 497 C182 475 365 433 562 376 C760 319 936 277 1126 257 C1374 230 1637 249 2010 169" fill="none" stroke="url(#road)" stroke-width="126" stroke-linecap="round" filter="url(#grain)"/>
  <path d="M-80 472 C181 452 369 411 558 357 C756 301 938 260 1122 241 C1368 215 1640 236 2010 154" fill="none" stroke="#dec397" stroke-width="9" stroke-linecap="round" opacity="0.24"/>
  <path d="M-80 524 C177 504 355 468 564 408 C760 351 936 305 1132 284 C1374 258 1644 277 2010 198" fill="none" stroke="#765f43" stroke-width="12" stroke-linecap="round" opacity="0.13"/>

  <!-- narrow house footpath joins the road organically -->
  <path d="M163 205 C192 244 214 282 258 316 C294 343 337 365 389 392" fill="none" stroke="#80694e" stroke-width="67" opacity="0.16" filter="url(#groundShadow)"/>
  <path d="M163 198 C190 239 214 276 256 309 C294 338 340 360 393 389" fill="none" stroke="url(#path)" stroke-width="49" stroke-linecap="round" filter="url(#grain)"/>
  <path d="M165 197 C190 237 215 272 258 304 C296 331 340 354 393 383" fill="none" stroke="#e3cda5" stroke-width="5" opacity="0.21"/>

  <!-- worn patches around places people actually stand -->
  <ellipse cx="557" cy="310" rx="102" ry="48" fill="#9b815c" opacity="0.11" filter="url(#soft)"/>
  <ellipse cx="747" cy="421" rx="132" ry="66" fill="#987c58" opacity="0.12" filter="url(#soft)"/>
  <ellipse cx="144" cy="267" rx="142" ry="72" fill="#b09066" opacity="0.09" filter="url(#soft)"/>

  <!-- vegetation masses painted into the plate; tall foreground occluders remain separate runtime layers -->
  <g opacity="0.72" filter="url(#grain)">
    <path d="M0 74 C77 39 125 67 183 45 C248 20 292 61 352 48 C389 40 423 20 467 31 L455 0 L0 0 Z" fill="#456d47"/>
    <path d="M1237 52 C1312 15 1379 54 1436 31 C1508 3 1574 47 1645 25 C1727 0 1808 37 1920 8 L1920 0 L1230 0 Z" fill="#456b45"/>
    <path d="M0 580 C82 542 146 584 218 553 C291 521 348 571 429 551 C486 537 525 554 572 578 L572 640 L0 640 Z" fill="#426943"/>
    <path d="M1367 576 C1449 537 1514 580 1580 550 C1661 514 1723 571 1796 541 C1843 521 1884 526 1920 536 L1920 640 L1360 640 Z" fill="#426943"/>
  </g>

  <!-- soft meadow brushwork -->
  <g fill="none" stroke-linecap="round" opacity="0.28">
    <path d="M73 327 l11 -18 M82 330 l18 -14 M101 335 l4 -19 M121 320 l12 -17 M456 134 l7 -18 M472 137 l14 -15 M990 505 l9 -21 M1007 509 l14 -17 M1510 389 l8 -20 M1525 390 l15 -16" stroke="#d0d99d" stroke-width="4"/>
    <path d="M310 108 l7 -16 M324 111 l12 -12 M676 531 l7 -17 M690 533 l13 -13 M1254 116 l8 -17 M1268 118 l13 -13 M1775 403 l8 -18 M1791 405 l13 -14" stroke="#4f7749" stroke-width="5"/>
  </g>

  <!-- restrained wildflowers, part of the painting rather than stamped props -->
  <g opacity="0.72">
    <circle cx="335" cy="178" r="3.8" fill="#e7d06a"/><circle cx="347" cy="171" r="2.8" fill="#efe0a0"/>
    <circle cx="1012" cy="151" r="3.2" fill="#e6c962"/><circle cx="1024" cy="158" r="2.5" fill="#f0dda0"/>
    <circle cx="1188" cy="492" r="3.6" fill="#d9c45f"/><circle cx="1203" cy="486" r="2.7" fill="#f2d98a"/>
    <circle cx="1644" cy="360" r="3.3" fill="#e7cf6d"/><circle cx="1657" cy="367" r="2.5" fill="#eedda0"/>
    <circle cx="226" cy="555" r="3.4" fill="#d6c75f"/><circle cx="240" cy="550" r="2.6" fill="#f0dda0"/>
  </g>

  <!-- subtle overall paper/paint texture -->
  <rect width="1920" height="640" fill="transparent" filter="url(#grain)"/>
</svg>